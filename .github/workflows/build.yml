name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Portable exe + MSIX (unsigned) + a test-signed MSIX copy, all via build.ps1.
      - name: Build exe + MSIX
        shell: pwsh
        run: ./build.ps1 -Target all -TestSign

      - name: Test sim
        run: ctest --test-dir build/msvc -C Release --output-on-failure

      # Smoke test: the package is valid and installs. Runner images may lack the
      # AppX deployment service, so this step only warns.
      - name: Install test-signed MSIX
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Certificate -FilePath dist/WinTers_TestCert.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $pkg = Get-ChildItem dist/*_testsigned.msix | Select-Object -First 1
          Add-AppxPackage -Path $pkg.FullName
          Get-AppxPackage AfterHoursLabs.WinTers | Format-List Name, Version, InstallLocation
          Get-AppxPackage AfterHoursLabs.WinTers | Remove-AppxPackage

      - uses: actions/upload-artifact@v4
        with:
          name: WinTers-x64
          path: dist/WinTers_*_x64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: WinTers-msix
          path: |
            dist/WinTers_*_x64.msix
            dist/WinTers_*_x64_testsigned.msix
            dist/WinTers_TestCert.cer
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Universal (arm64 + x86_64) WinTers.app, ad-hoc signed, as .dmg and .zip;
      # build.sh also runs the sim tests.
      - name: Build app + DMG
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WinTers-macOS
          path: |
            dist/WinTers_*_macOS.dmg
            dist/WinTers_*_macOS.zip
          if-no-files-found: error

  sim-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & test sim (ASan/UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
