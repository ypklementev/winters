name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Each job runs only when files it builds from have changed: a README edit builds
# nothing, a src/mac/ edit builds only macOS. workflow_dispatch builds everything.
jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      macos: ${{ steps.filter.outputs.macos }}
      sim: ${{ steps.filter.outputs.sim }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/build.yml
              - CMakeLists.txt
              - src/sim/**
              - src/render/flake_atlas.*
              - src/render/shapes.*
              - src/render/instances.*
              - tests/**
            sim:
              - *shared
            windows:
              - *shared
              - build.ps1
              - cmake/**
              - packaging/AppxManifest.xml
              - packaging/Assets/**
              - src/app/**
              - src/input/**
              - src/overlay/**
              - src/render/**
              - src/windows_tracker/**
            macos:
              - *shared
              - build.sh
              - packaging/macos/**
              - src/mac/**
              - tools/mac_preview.mm

  windows-msvc:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.windows == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Portable exe + MSIX (unsigned) + a test-signed MSIX copy, all via build.ps1.
      - name: Build exe + MSIX
        shell: pwsh
        run: ./build.ps1 -Target all -TestSign

      - name: Test sim
        run: ctest --test-dir build/msvc -C Release --output-on-failure

      # Smoke test: the package is valid and installs. Runner images may lack the
      # AppX deployment service, so this step only warns.
      - name: Install test-signed MSIX
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Certificate -FilePath dist/WinTers_TestCert.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $pkg = Get-ChildItem dist/*_testsigned.msix | Select-Object -First 1
          Add-AppxPackage -Path $pkg.FullName
          Get-AppxPackage AfterHoursLabs.WinTers | Format-List Name, Version, InstallLocation
          Get-AppxPackage AfterHoursLabs.WinTers | Remove-AppxPackage

      - uses: actions/upload-artifact@v4
        with:
          name: WinTers-x64
          path: dist/WinTers_*_x64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: WinTers-msix
          path: |
            dist/WinTers_*_x64.msix
            dist/WinTers_*_x64_testsigned.msix
            dist/WinTers_TestCert.cer
          if-no-files-found: error

  macos:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Universal (arm64 + x86_64) WinTers.app, ad-hoc signed, as .dmg and .zip;
      # build.sh also runs the sim tests.
      - name: Build app + DMG
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WinTers-macOS
          path: |
            dist/WinTers_*_macOS.dmg
            dist/WinTers_*_macOS.zip
          if-no-files-found: error

  sim-tests-linux:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.sim == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & test sim (ASan/UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
